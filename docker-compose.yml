services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-securedme}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-securedme_education}
      AUTH0_ISSUER_BASE_URL: ${AUTH0_ISSUER_BASE_URL:?Set AUTH0_ISSUER_BASE_URL}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:?Set AUTH0_AUDIENCE}
      BROKER_RECEIPT_SIGNING_KEY: ${BROKER_RECEIPT_SIGNING_KEY:?Set BROKER_RECEIPT_SIGNING_KEY}
      SUBJECT_HASH_PEPPER: ${SUBJECT_HASH_PEPPER:?Set SUBJECT_HASH_PEPPER}
      BROKER_BASE_URL: ${BROKER_BASE_URL:?Set the public HTTPS broker URL}
      BROKER_ALLOWED_ORIGINS: ${BROKER_ALLOWED_ORIGINS:-https://algoquest.securedme.ca}
    depends_on:
      - db
      - redis
      - nginx
      - prometheus
      - grafana
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-securedme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-securedme_education}
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:6.2.6
    ports:
      - "6379:6379"
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3001"
    volumes:
      - grafana-data:/var/lib/grafana
volumes:
  pgdata:
  grafana-data:
